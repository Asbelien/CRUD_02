<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerdeVivo - Dashboard de Gestión</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 (Alertas pro) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary-green: #2e7d32; --dark-green: #1b5e20; }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-custom { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
        .card { border: none; border-radius: 12px; transition: transform 0.2s; }
        .card-stats { border-left: 5px solid var(--primary-green); }
        .btn-success-custom { background-color: var(--primary-green); border: none; }
        .btn-success-custom:hover { background-color: var(--dark-green); }
        .table-hover tbody tr:hover { background-color: rgba(46, 125, 50, 0.05); }
        .badge-tipo { font-size: 0.85rem; padding: 6px 12px; border-radius: 20px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark navbar-custom mb-4 shadow">
    <div class="container">
            <span class="navbar-brand mb-0 h1 fs-4">
                <i class="fa-solid fa-seedling me-2"></i>VerdeVivo Admin
            </span>
    </div>
</nav>

<div class="container">
    <!-- Métricas Rápidas (Cards) -->
    <div class="row mb-4">
        <div class="col-md-4 mb-2">
            <div class="card card-stats shadow-sm p-3 bg-white">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-success text-white p-3 me-3 fs-3"><i class="fa-solid fa-leaf"></i></div>
                    <div>
                        <h6 class="text-muted mb-0">Total Plantas</h6>
                        <h3 class="mb-0 fw-bold" id="statTotal">0</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card card-stats shadow-sm p-3 bg-white" style="border-left-color: #ff9800;">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-warning text-white p-3 me-3 fs-3"><i class="fa-solid fa-boxes-stacked"></i></div>
                    <div>
                        <h6 class="text-muted mb-0">Stock Total</h6>
                        <h3 class="mb-0 fw-bold" id="statStock">0</h3>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-2">
            <div class="card card-stats shadow-sm p-3 bg-white" style="border-left-color: #0288d1;">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle bg-info text-white p-3 me-3 fs-3"><i class="fa-solid fa-dollar-sign"></i></div>
                    <div>
                        <h6 class="text-muted mb-0">Valor Estimado</h6>
                        <h3 class="mb-0 fw-bold" id="statValor">$0.00</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- Formulario -->
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header text-white bg-success fw-bold" id="formHeader">
                    <i class="fa-solid fa-plus me-1"></i> Registrar Planta
                </div>
                <div class="card-body p-4">
                    <form id="plantaForm">
                        <input type="hidden" id="plantaId">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ej. Monstera" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Categoría</label>
                            <select class="form-select" id="tipo" required>
                                <option value="" disabled selected>Seleccionar...</option>
                                <option value="Interior">Interior</option>
                                <option value="Exterior">Exterior</option>
                                <option value="Suculenta">Suculenta</option>
                                <option value="Cactus">Cactus</option>
                                <option value="Orquídea">Orquídea</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-semibold">Precio ($)</label>
                                <input type="number" step="0.01" class="form-control" id="precio" placeholder="0.00" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-semibold">Stock</label>
                                <input type="number" class="form-control" id="stock" placeholder="0" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success-custom text-white w-100 mb-2 shadow-sm" id="btnGuardar">
                            <i class="fa-solid fa-floppy-disk me-1"></i> Guardar
                        </button>
                        <button type="button" class="btn btn-outline-secondary w-100 d-none" id="btnCancelar" onclick="resetForm()">
                            Cancelar
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Tabla -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                    <h5 class="mb-0 text-success fw-bold"><i class="fa-solid fa-list me-2"></i> Inventario</h5>
                    <input type="text" id="buscarInput" class="form-control form-control-sm w-50" placeholder="🔍 Buscar por nombre..." onkeyup="filtrarPlantas()">
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-center">
                            <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Planta</th>
                                <th>Tipo</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody id="tablaPlantas"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = '/api/plantas';
    let listaGlobal = [];

    document.addEventListener('DOMContentLoaded', cargarPlantas);
    document.getElementById('plantaForm').addEventListener('submit', guardarPlanta);

    async function cargarPlantas() {
        try {
            const res = await fetch(API_URL);
            listaGlobal = await res.json();
            renderTabla(listaGlobal);
            actualizarMetricas(listaGlobal);
        } catch (error) {
            console.error('Error al cargar datos:', error);
        }
    }

    function renderTabla(plantas) {
        const tbody = document.getElementById('tablaPlantas');
        tbody.innerHTML = plantas.length === 0
            ? `<tr><td colspan="6" class="text-muted p-4">Sin registros en la base de datos.</td></tr>`
            : plantas.map(p => `
                    <tr>
                        <td class="text-muted">#${p.id}</td>
                        <td class="fw-bold">${p.nombre}</td>
                        <td><span class="badge bg-success badge-tipo">${p.tipo}</span></td>
                        <td class="text-success fw-bold">$${p.precio.toFixed(2)}</td>
                        <td><span class="badge ${p.stock < 5 ? 'bg-danger' : 'bg-secondary'}">${p.stock} unidades</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-warning me-1" onclick="cargarParaEditar(${p.id}, '${p.nombre}', '${p.tipo}', ${p.precio}, ${p.stock})">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarPlanta(${p.id})">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
    }

    function actualizarMetricas(plantas) {
        document.getElementById('statTotal').innerText = plantas.length;
        const stockTotal = plantas.reduce((acc, p) => acc + p.stock, 0);
        const valorTotal = plantas.reduce((acc, p) => acc + (p.precio * p.stock), 0);

        document.getElementById('statStock').innerText = stockTotal;
        document.getElementById('statValor').innerText = `$${valorTotal.toFixed(2)}`;
    }

    function filtrarPlantas() {
        const texto = document.getElementById('buscarInput').value.toLowerCase();
        const filtradas = listaGlobal.filter(p => p.nombre.toLowerCase().includes(texto));
        renderTabla(filtradas);
    }

    async function guardarPlanta(e) {
        e.preventDefault();
        const id = document.getElementById('plantaId').value;
        const plantaData = {
            nombre: document.getElementById('nombre').value,
            tipo: document.getElementById('tipo').value,
            precio: parseFloat(document.getElementById('precio').value),
            stock: parseInt(document.getElementById('stock').value)
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(plantaData)
        });

        Swal.fire({
            icon: 'success',
            title: id ? '¡Planta Actualizada!' : '¡Planta Registrada!',
            showConfirmButton: false,
            timer: 1500
        });

        resetForm();
        cargarPlantas();
    }

    function cargarParaEditar(id, nombre, tipo, precio, stock) {
        document.getElementById('plantaId').value = id;
        document.getElementById('nombre').value = nombre;
        document.getElementById('tipo').value = tipo;
        document.getElementById('precio').value = precio;
        document.getElementById('stock').value = stock;

        document.getElementById('formHeader').innerHTML = '<i class="fa-solid fa-pen me-1"></i> Editar Planta';
        document.getElementById('btnGuardar').className = 'btn btn-warning w-100 mb-2';
        document.getElementById('btnCancelar').classList.remove('d-none');
    }

    async function eliminarPlanta(id) {
        const result = await Swal.fire({
            title: '¿Eliminar planta?',
            text: "Esta acción no se puede deshacer",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#d33',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'Sí, eliminar',
            cancelButtonText: 'Cancelar'
        });

        if (result.isConfirmed) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            Swal.fire('Eliminado', 'La planta ha sido removida.', 'success');
            cargarPlantas();
        }
    }

    function resetForm() {
        document.getElementById('plantaForm').reset();
        document.getElementById('plantaId').value = '';
        document.getElementById('formHeader').innerHTML = '<i class="fa-solid fa-plus me-1"></i> Registrar Planta';
        document.getElementById('btnGuardar').className = 'btn btn-success-custom text-white w-100 mb-2 shadow-sm';
        document.getElementById('btnCancelar').classList.add('d-none');
    }
</script>
</body>
</html>
