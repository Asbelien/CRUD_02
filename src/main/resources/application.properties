spring.application.name=verdevivo

# Captura el puerto dinámico que asigna Render (si no existe, usa 8080 en local)
server.port=${PORT:8080}

# Variables de entorno inyectadas desde Render (o valores por defecto locales)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/verdevivo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Tecsup}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect